<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QuickApply</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="popup-root">

        <!-- ═══ HEADER ═══ -->
        <header class="popup-header">
            <div class="header-left">
                <img src="../icons/icon48.png" alt="" class="popup-logo-icon">
                <span class="popup-logo-text">QuickApply</span>
            </div>
            <button id="btn-gear" class="icon-btn" aria-label="Open Dashboard" title="Dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
        </header>

        <!-- ═══ STATE: EMPTY ═══ -->
        <div id="state-empty" class="popup-state hidden">
            <svg class="empty-illustration" viewBox="0 0 120 120" fill="none" width="100" height="100">
                <circle cx="60" cy="60" r="55" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"
                    opacity="0.15" />
                <path d="M50 45h20v30H50z" stroke="currentColor" stroke-width="1.5" opacity="0.25" />
                <circle cx="60" cy="53" r="5" stroke="currentColor" stroke-width="1.5" opacity="0.25" />
                <path d="M49 75c0-6 5-11 11-11s11 5 11 11" stroke="currentColor" stroke-width="1.5" opacity="0.25" />
            </svg>
            <h2 class="empty-title">No Clients Yet</h2>
            <p class="empty-subtitle">Add your first client to get started</p>
            <button id="btn-empty-dashboard" class="btn btn-primary btn-md">Open Dashboard</button>
        </div>

        <!-- ═══ STATE: DEFAULT CLIENT ═══ -->
        <div id="state-default" class="popup-state hidden">
            <div class="pinned-section">
                <div class="pinned-meta">
                    <div class="pinned-chip">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M16 3a1 1 0 0 1 .707 1.707L13 8.414V12a1 1 0 0 1-.293.707l-5 5A1 1 0 0 1 6 17v-4.586L2.707 9.121A1 1 0 0 1 3.414 7.414L7 9.586V6a1 1 0 0 1 .293-.707l5-5A1 1 0 0 1 13 0h3z"/>
                        </svg>
                        Pinned Client
                    </div>
                    <button id="btn-change-client" class="btn-swap" aria-label="Switch client" title="Switch client">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/>
                        </svg>
                        Switch
                    </button>
                </div>
                <div class="pinned-client-card">
                    <div class="active-avatar" id="default-avatar-el">??</div>
                    <div class="active-info">
                        <div class="active-name" id="default-name-el">Unknown</div>
                        <div class="active-email" id="default-email-el">No email</div>
                    </div>
                    <div class="pinned-icon-mark" aria-hidden="true">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2l2.09 6.26H21l-5.47 3.97 2.08 6.26L12 14.52l-5.61 4-2.08-6.26L4.47 12.23 2 8.26h6.91z"/>
                        </svg>
                    </div>
                </div>
                <section id="fit-card" class="fit-card hidden" aria-live="polite">
                    <div class="fit-card__header">
                        <span class="fit-card__verdict" id="fit-verdict" data-verdict=""></span>
                        <span class="fit-card__job" id="fit-job-meta"></span>
                    </div>
                    <div class="fit-card__breakdown" id="fit-breakdown"></div>
                    <button type="button" id="fit-card-toggle" class="fit-card__toggle hidden">Show details</button>
                </section>

                <section id="jd-queue-card" class="jd-queue-card hidden" aria-live="polite">
                    <div class="jd-queue-card__header">
                        <span class="jd-queue-card__title">Queue</span>
                        <span class="jd-queue-card__count" id="jd-queue-count">0</span>
                    </div>
                    <ul class="jd-queue-card__list" id="jd-queue-list"></ul>
                    <div class="jd-queue-card__actions">
                        <button type="button" id="btn-jd-queue-run" class="btn btn-primary btn-sm">Run analysis</button>
                        <button type="button" id="btn-jd-queue-clear" class="btn btn-ghost btn-sm">Clear</button>
                    </div>
                </section>

                <button id="btn-fill-now" class="btn btn-primary btn-fill-big">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    <span id="btn-fill-now-label">Fill Form</span>
                </button>
                <div id="duplicate-warning" class="duplicate-warning hidden" role="alert" aria-live="polite">
                    <div class="duplicate-warning__icon" aria-hidden="true">⚠</div>
                    <div class="duplicate-warning__body">
                        <div class="duplicate-warning__title">Already applied to this job</div>
                        <div class="duplicate-warning__detail" id="duplicate-warning-detail"></div>
                    </div>
                    <button type="button" id="btn-duplicate-dismiss" class="duplicate-warning__dismiss" aria-label="Dismiss warning">×</button>
                </div>
                <div class="fill-settings">
                    <label class="toggle-label">
                        <input type="checkbox" id="autoAdvanceSteps" checked>
                        Auto-advance form steps
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="autoSubmit">
                        Auto-submit <span class="setting-warning">⚠ Review first</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="forceAI">
                        Always use AI <span class="setting-warning">uses API</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- ═══ STATE: CLIENT LIST ═══ -->
        <div id="state-list" class="popup-state">
            <div id="shift-header-strip" class="shift-header-strip hidden" role="status" aria-live="polite">
                <div class="shift-header-strip__top">
                    <span class="shift-header-strip__date" id="shift-header-date">Today</span>
                    <span class="shift-header-strip__totals" id="shift-header-totals">0 / 0</span>
                    <span class="shift-header-strip__remaining" id="shift-header-remaining"></span>
                </div>
                <div class="shift-header-strip__bar">
                    <div class="shift-header-strip__fill" id="shift-header-fill"></div>
                </div>
            </div>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    width="14" height="14">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search clients..."
                    aria-label="Search clients">
                <button id="search-clear" class="search-clear hidden" aria-label="Clear search">×</button>
            </div>

            <div class="client-scroll" id="client-scroll">
                <div id="client-list">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <div class="list-footer">
                <span id="list-client-count" class="footer-count">0 clients</span>
                <button id="btn-footer-dashboard" class="footer-link">Dashboard →</button>
            </div>
        </div>

        <!-- ═══ STATE: FILLING ═══ -->
        <div id="state-filling" class="popup-state hidden">
            <div class="filling-container">
                <div class="filling-spinner"></div>
                <p class="filling-text">Filling form...</p>
                <div class="fill-progress-track">
                    <div class="fill-progress-bar" id="fill-progress-bar"></div>
                </div>
                <p class="filling-progress" id="filling-progress">Preparing...</p>
            </div>
        </div>

        <!-- ═══ STATE: REVIEW ═══ -->
        <div id="state-review" class="popup-state hidden">
            <div class="review-header">
                <button id="btn-back" class="btn btn-ghost btn-sm" aria-label="Go back">← Back</button>
                <span class="review-title">Fill Report</span>
            </div>

            <div class="review-client-badge" id="review-badge">
                <!-- Rendered by JS -->
            </div>

            <div class="review-summary" id="review-summary">
                <!-- Stats rendered by JS -->
            </div>

            <div class="review-scroll" id="review-scroll">
                <div id="review-results">
                    <!-- Rows rendered by JS -->
                </div>
            </div>

            <div class="review-actions">
                <button id="btn-edit" class="btn btn-outline btn-md">✏️ Edit</button>
                <button id="btn-refill" class="btn btn-outline btn-md">🔄 Re-fill</button>
                <button id="btn-clear" class="btn btn-danger btn-md">Clear All</button>
            </div>

            <p class="review-reminder">⚠️ Review all fields, then submit manually</p>
        </div>

    </div>

    <script src="../storage.js"></script>
    <script src="../jd-queue.js"></script>
    <script src="popup.js"></script>
</body>

</html>
